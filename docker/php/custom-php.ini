; ==============================================================================
; DeadlineFlow - Custom PHP Configuration
; ==============================================================================
; This file overrides the default PHP settings for the container.
; It is copied to /usr/local/etc/php/conf.d/custom-php.ini during the build.
; These settings optimize performance, security, and upload limits.
; ==============================================================================

; ==========================================
; 1. File Uploads & POST Data
; ==========================================
; Maximum size for uploaded files (e.g., task attachments). Set to 10MB.
upload_max_filesize = 10M

; Maximum size for POST data (must be slightly larger than upload_max_filesize).
; This includes all form fields plus the uploaded file.
post_max_size = 12M

; ==========================================
; 2. Input & Form Limits
; ==========================================
; Maximum number of input variables (form fields) allowed per request.
; Prevents DoS attacks that send thousands of empty form fields.
max_input_vars = 1000

; ==========================================
; 3. Memory & Execution
; ==========================================
; Maximum memory a single PHP script can consume. 256MB is sufficient for Laravel.
memory_limit = 256M

; Maximum execution time for a script (in seconds). 
; Set to 60s to allow heavy operations (e.g., PDF generation) without timing out.
max_execution_time = 60