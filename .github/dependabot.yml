version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
    registries:
      - packagist-original

  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "daily"

registries:
  packagist-original:
    type: composer-repository
    url: https://repo.packagist.org
    username: ""
    password: ""