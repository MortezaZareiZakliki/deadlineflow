# ==============================================================================
# DeadlineFlow - Docker Compose Configuration
# ==============================================================================
# This file defines the entire stack for running DeadlineFlow.
# Services: app (PHP-FPM), scheduler, queue, db (MySQL), nginx, redis, rabbitmq.
# ==============================================================================

services:
  # ==========================================
  # 1. Application (PHP-FPM)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deadlineflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    # Run as non-root user (matches the 'appuser' created in Dockerfile)
    user: "1000:1000"
    ports:
      # Uncomment the line below if you want to access PHP-FPM directly (not recommended, use Nginx).
      # - "8080:8080"
      
      # Vite's HMR port (for local development only).
      # ⚠️ In production, you should COMMENT this line out to avoid exposing the dev server.
      - "5173:5173"
    expose:
      # Expose port 9000 for Nginx to communicate with PHP-FPM internally
      - "9000"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deadlineflow_network

  # ==========================================
  # 2. Scheduler (Laravel Task Scheduling)
  # ==========================================
  # This container runs the Laravel scheduler every minute.
  # It is responsible for executing scheduled tasks (e.g., sending deadline reminders).
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deadlineflow_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    # Loop every 60 seconds to check for scheduled tasks
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deadlineflow_network

  # ==========================================
  # 3. Queue Worker (Redis & RabbitMQ)
  # ==========================================
  # This container processes background jobs from RabbitMQ.
  # It handles tasks like sending emails, notifications, etc.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deadlineflow_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    # Process jobs from RabbitMQ with 3 retries and a 90-second timeout
    command: php artisan queue:work rabbitmq --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - deadlineflow_network

  # ==========================================
  # 4. Database (MySQL 8.4)
  # ==========================================
  db:
    image: mysql:8.4
    container_name: deadlineflow_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deadlineflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: mysql
      # Set the timezone to match the app
      TZ: Asia/Tehran
    # Set the default timezone to Iran (+03:30)
    command: --default-time-zone='+03:30'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Ensure MySQL is fully ready before the app starts
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - deadlineflow_network

  # ==========================================
  # 5. Web Server (Nginx)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: deadlineflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - deadlineflow_network

  # ==========================================
  # 6. Cache & Queue (Redis)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: deadlineflow_redis
    restart: unless-stopped
    # Require a password (passed from the .env or secrets)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deadlineflow_network

  # ==========================================
  # 7. Message Broker (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: deadlineflow_rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq
    networks:
      - deadlineflow_network

# ==========================================
# Networks & Volumes
# ==========================================
networks:
  deadlineflow_network:
    driver: bridge

volumes:
  db_data:
  redis_data: